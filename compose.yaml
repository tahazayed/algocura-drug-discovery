services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    hostname: sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "DontLogin!Passw0rd"
      MSSQL_PID: "Developer"

    ports:
      - "1433:1433"

    volumes:
      - sqlserver-data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'DontLogin!Passw0rd' -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

    restart: unless-stopped

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: azurite

    command:
      - azurite
      - --blobHost
      - 0.0.0.0
      - --queueHost
      - 0.0.0.0
      - --tableHost
      - 0.0.0.0
      - --location
      - /data

    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"

    volumes:
      - azurite-data:/data

    restart: unless-stopped

  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    container_name: servicebus-emulator

    environment:
      ACCEPT_EULA: "Y"
      SQL_SERVER: "sqlserver"
      MSSQL_SA_PASSWORD: "DontLogin!Passw0rd"
      EMULATOR_HTTP_PORT: "5300"

    ports:
      - "5672:5672"
      - "5300:5300"
      - "8021:8080"
    volumes:
      - ./servicebus-config.json:/ServiceBus_Emulator/ConfigFiles/Config.json

    depends_on:
      sqlserver:
        condition: service_healthy
    
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://localhost:5300/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    
    restart: unless-stopped

  servicebus-wait:
    image: curlimages/curl:8.12.1
    container_name: servicebus-wait
    depends_on:
      servicebus-emulator:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Service Bus Emulator..."
        sleep 20

        until curl \
          --silent \
          --show-error \
          --fail \
          http://servicebus-emulator:5300/health; do
          echo "Service Bus Emulator is not ready. Retrying in 5 seconds..."
          sleep 5
        done

        echo "Service Bus Emulator is ready."
    restart: "no"
    
  compound-catalog-api:
    build:
      context: ./Algocura.CompoundCatalog.Api
      dockerfile: Dockerfile
      target: final

    image: algocura/compound-catalog-api:dev
    container_name: compound-catalog-api

    ports:
      - "7001:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__CompoundCatalogDatabase: "Server=sqlserver,1433;Database=AlgocuraCompoundCatalog;User Id=sa;Password=DontLogin!Passw0rd;TrustServerCertificate=True;Encrypt=False;ConnectRetryCount=5;ConnectRetryInterval=5"

      ServiceBus__UseEmulator: "true"
      ServiceBus__ConnectionString: "Endpoint=sb://servicebus-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"
      ServiceBus__FullyQualifiedNamespace: ""
      ServiceBus__TopicName: "algocura-events"
      ServiceBus__SubscriptionName: "compound-catalog-api"
      Logging__LogLevel__Default: "Information"
      Logging__LogLevel__Microsoft__AspNetCore: "Warning"
      Logging__LogLevel__Microsoft__EntityFrameworkCore: "Information"
      Logging__LogLevel__Azure__Messaging__ServiceBus: "Information"
    depends_on:
      sqlserver:
        condition: service_healthy
      servicebus-wait:
        condition: service_completed_successfully

    restart: unless-stopped

  screening-api:
    build:
      context: ./Algocura.Screening.Api
      dockerfile: Dockerfile
      target: final

    image: algocura/algocura-screening-api:dev
    container_name: screening-api    
    ports:
      - "7002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__ScreeningDatabase: "Server=sqlserver,1433;Database=AlgocuraScreening;User Id=sa;Password=DontLogin!Passw0rd;TrustServerCertificate=True;Encrypt=False;ConnectRetryCount=5;ConnectRetryInterval=5"
      ServiceBus__UseEmulator: "true"
      ServiceBus__ConnectionString: "Endpoint=sb://servicebus-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"
      ServiceBus__FullyQualifiedNamespace: ""
      ServiceBus__TopicName: "algocura-events"
      ServiceBus__SubscriptionName: "screening-api"      
      Logging__LogLevel__Default: "Information"
      Logging__LogLevel__Microsoft__AspNetCore: "Warning"
      Logging__LogLevel__Microsoft__EntityFrameworkCore: "Information"
      Logging__LogLevel__Azure__Messaging__ServiceBus: "Information"      
    depends_on:
      sqlserver:
        condition: service_healthy
      servicebus-wait:
        condition: service_completed_successfully
    
    restart: unless-stopped

  ai-discovery-api:
    build:
      context: ./Algocura.AIDiscovery.Api
      dockerfile: Dockerfile
      target: final

    image: algocura/algocura-ai-discovery-api:dev
    container_name: ai-discovery-api    
    ports:
      - "7003:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__AIDiscoveryDatabase: "Server=sqlserver,1433;Database=AlgocuraAIDiscovery;User Id=sa;Password=DontLogin!Passw0rd;TrustServerCertificate=True;Encrypt=False;ConnectRetryCount=5;ConnectRetryInterval=5"
      ServiceBus__UseEmulator: "true"
      ServiceBus__ConnectionString: "Endpoint=sb://servicebus-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"
      ServiceBus__FullyQualifiedNamespace: ""
      ServiceBus__TopicName: "algocura-events"
      ServiceBus__SubscriptionName: "ai-discovery-api"      
      Logging__LogLevel__Default: "Information"
      Logging__LogLevel__Microsoft__AspNetCore: "Warning"
      Logging__LogLevel__Microsoft__EntityFrameworkCore: "Information"
      Logging__LogLevel__Azure__Messaging__ServiceBus: "Information"      
    depends_on:
      sqlserver:
        condition: service_healthy
      servicebus-wait:
        condition: service_completed_successfully
    
    restart: unless-stopped
        
volumes:
  sqlserver-data:
  azurite-data:
